<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kinetone</title>
<meta name="description" content="カメラ 1 台で遊べる運動アプリ集">
<style>
  :root{
    --bg-1:#0d1726;
    --bg-2:#152238;
    --card:#1b2a44;
    --card-hover:#25395b;
    --text:#f2f5fb;
    --text-dim:#a8b6cd;
    --accent:#7bf2cd;
    --warm:#f2a13a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Meiryo",sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%);
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    padding:clamp(14px,2.6vw,32px) clamp(14px,3vw,40px) clamp(28px,5vh,56px);
  }
  .wrap{max-width:1240px;margin:0 auto;}

  /* 見出しは小さく。1画面のうちタイルに使える面積を最優先する */
  header{display:flex;align-items:baseline;gap:.9em;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,20px);}
  .brand{margin:0;font-size:clamp(14px,1.7vw,18px);letter-spacing:.3em;color:var(--accent);text-transform:uppercase;}
  .tagline{margin:0;color:var(--text-dim);font-size:clamp(12px,1.5vw,15px);}

  h2{display:flex;align-items:center;gap:.6em;
     font-size:clamp(16px,2.1vw,22px);font-weight:800;letter-spacing:.1em;color:var(--text);
     margin:clamp(14px,2.4vh,24px) 0 clamp(8px,1.4vh,14px);}
  h2::after{content:"";flex:1;height:1px;background:#ffffff1f;}

  .tiles{display:grid;gap:clamp(10px,1.4vw,18px);
         grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));
         list-style:none;padding:0;margin:0;}
  .tile{display:block;text-decoration:none;color:inherit;
        background:var(--card);border-radius:18px;overflow:hidden;
        box-shadow:0 8px 24px #0006, inset 0 0 0 1px #ffffff14;
        transition:background .15s ease, transform .08s ease;}
  .tile:hover{background:var(--card-hover);}
  .tile:active{transform:translateY(2px);}
  .tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  /* サムネイルは 16:9 で書き出してあるので、幅だけ合わせれば切れずに収まる */
  .tile img{display:block;width:100%;height:auto;background:#0a1220;}
  .tile .body{padding:clamp(10px,1.4vw,16px) clamp(12px,1.6vw,18px) clamp(12px,1.8vw,18px);}
  .tile .name{display:block;font-size:clamp(17px,2.1vw,22px);font-weight:800;line-height:1.35;}
  .tile .desc{display:block;margin-top:.35em;font-size:clamp(12px,1.4vw,15px);color:var(--text-dim);line-height:1.6;}

  /* 「はかる」は測定であることが一目で分かるよう縁の色を変える */
  .tile--measure{box-shadow:0 8px 24px #0006, inset 0 0 0 2px #7bf2cd55;}

  /* 職員向けは利用者が押す導線と混ざらないよう、最後に小さく置く */
  .staff{margin-top:clamp(22px,4vh,40px);display:flex;justify-content:flex-end;}
  .staff-btn{display:inline-flex;align-items:center;gap:.6em;
             font-family:inherit;font-size:clamp(13px,1.5vw,16px);font-weight:700;
             color:var(--text-dim);background:#ffffff0f;border:1px solid #ffffff1f;
             padding:.7em 1.4em;border-radius:999px;text-decoration:none;cursor:default;}
  .staff-btn .badge{font-size:.85em;font-weight:700;color:#0d1726;background:var(--text-dim);
                    padding:.1em .7em;border-radius:999px;}

  footer{margin-top:clamp(14px,2vh,20px);color:var(--text-dim);
         font-size:clamp(11px,1.3vw,14px);line-height:1.8;text-align:right;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand">kinetone</p>
    <p class="tagline">カメラに映るだけで遊べます。映像はこの端末の中だけで使い、外には送りません。</p>
  </header>

  <main>
    <h2>あそぶ</h2>
    <ul class="tiles">
      <li><a class="tile" href="/stepping/">
        <img src="thumbs/stepping.jpg" alt="" width="480" height="270">
        <span class="body">
          <span class="name">おさんぽ足踏み</span>
          <span class="desc">その場で足踏みすると、石畳の街が進みます</span>
        </span>
      </a></li>
      <li><a class="tile" href="/hanabi/">
        <img src="thumbs/hanabi.jpg" alt="" width="480" height="270">
        <span class="body">
          <span class="name">みんなで花火</span>
          <span class="desc">みんなで手を振ると、夜空に花火が上がります</span>
        </span>
      </a></li>
      <li><a class="tile" href="/aiube/">
        <img src="thumbs/aiube.jpg" alt="" width="480" height="270">
        <span class="body">
          <span class="name">あいうべ体操</span>
          <span class="desc">「あ・い・う・べ」と口を大きく動かします</span>
        </span>
      </a></li>
    </ul>

    <h2>はかる</h2>
    <ul class="tiles">
      <li><a class="tile tile--measure" href="/steptest/">
        <img src="thumbs/steptest.jpg" alt="" width="480" height="270">
        <span class="body">
          <span class="name">2分間足踏みテスト</span>
          <span class="desc">その場足踏みの回数を数え、年代・性別の基準と比べます</span>
        </span>
      </a></li>
      <li><a class="tile tile--measure" href="/chair-stand/">
        <img src="thumbs/chair-stand.jpg" alt="" width="480" height="270">
        <span class="body">
          <span class="name">5回椅子立ち上がり</span>
          <span class="desc">立ち座り5回にかかる時間を計ります</span>
        </span>
      </a></li>
    </ul>
  </main>

  <div class="staff">
    <span class="staff-btn">職員メニュー<span class="badge">準備中</span></span>
  </div>

  <footer>
    <p>記録はこの端末のブラウザにのみ保存されます。カメラの映像は保存も送信もしません。</p>
  </footer>
</div>
</body>
</html>
