<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KINETONE：キネトーン　高齢者向け体感ゲーム</title>
<meta name="description" content="KINETONE（キネトーン）— カメラ 1 台で遊べる高齢者向け体感ゲーム">
<style>
  :root{
    /* 明るい地に濃い文字。真っ白(#fff)はタブレットで反射がきついので少し灰みを入れる */
    --bg-1:#f7f8fb;
    --bg-2:#eceff5;
    --card:#ffffff;
    --card-hover:#f2f5fa;
    --line:#dbe1ec;
    --text:#182234;
    --text-dim:#5a6a80;
    --accent:#0e8f79;   /* 白地でも十分に濃い緑（コントラスト比 4.5:1 以上） */
    --warm:#b8681a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Meiryo",sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%);
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    padding:clamp(14px,2.6vw,32px) clamp(14px,3vw,40px) clamp(28px,5vh,56px);
  }
  .wrap{max-width:1240px;margin:0 auto;}

  /* 見出しは小さく。1画面のうちタイルに使える面積を最優先する */
  header{display:flex;align-items:baseline;gap:.5em 1em;flex-wrap:wrap;margin-bottom:clamp(12px,2vh,20px);}
  /* 古いブラウザへの警告。古い端末でも崩れないよう、素直な指定だけで書く。 */
  #too-old{background:#fff4e5;border:2px solid #d98324;border-radius:12px;
           padding:14px 18px;margin-bottom:20px;color:#5c3b0e;}
  #too-old strong{font-size:1.15em;}
  #too-old p{margin:.4em 0 0;font-size:1em;line-height:1.6;}
  #too-old .detail{font-size:.85em;color:#8a6b3a;}
  #too-old .detail:empty{display:none;}
  h1{margin:0;font-size:clamp(18px,2.4vw,26px);font-weight:800;letter-spacing:.02em;}
  h1 .brand{color:var(--accent);letter-spacing:.18em;}
  h1 .kana{color:var(--text-dim);font-weight:700;font-size:.8em;letter-spacing:.06em;}
  .note{margin:0;color:var(--text-dim);font-size:clamp(12px,1.5vw,15px);}

  h2{display:flex;align-items:center;gap:.6em;
     font-size:clamp(16px,2.1vw,22px);font-weight:800;letter-spacing:.1em;color:var(--text);
     margin:clamp(14px,2.4vh,24px) 0 clamp(8px,1.4vh,14px);}
  h2::after{content:"";flex:1;height:1px;background:var(--line);}

  /* grid-auto-rows:1fr で全ての行を同じ高さにする。名前や説明の行数が違っても
     カードの大きさが揃い、並べたときに凸凹しない */
  .tiles{display:grid;gap:clamp(10px,1.4vw,18px);
         grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));
         grid-auto-rows:1fr;
         list-style:none;padding:0;margin:0;}
  /* カードは <li> の高さいっぱいまで伸ばす（<a> のままだと中身の分しか伸びない） */
  .tiles > li{display:flex;}
  .tile{display:flex;flex-direction:column;width:100%;text-decoration:none;color:inherit;
        background:var(--card);border-radius:18px;overflow:hidden;
        box-shadow:0 6px 18px #1822341a, inset 0 0 0 1px var(--line);
        transition:background .15s ease, transform .08s ease;}
  .tile:hover{background:var(--card-hover);}
  .tile:active{transform:translateY(2px);}
  .tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  /* サムネイルは 16:9 で書き出してあるので、幅だけ合わせれば切れずに収まる */
  .tile img{display:block;flex:0 0 auto;width:100%;height:auto;background:#e7ebf2;}
  /* span のままだと中のブロック要素に左右の padding が効かないので block にする。
     余った高さはここで受けて、カードの下端まで白地を伸ばす */
  .tile .body{display:block;flex:1;padding:clamp(12px,1.6vw,18px) clamp(16px,2vw,22px) clamp(14px,2vw,20px);}
  /* どこを動かす遊びか・何人で遊ぶかを一目で分かるように */
  .tile .tags{display:flex;flex-wrap:wrap;gap:.4em;margin-bottom:.55em;}
  /* 長いタグ（「立ち座りの力と持久力をはかる」など）は 1 行だとカードからはみ出して
     右側が切れるので、収まらなければ折り返す */
  .tile .tag{display:inline-block;max-width:100%;
             font-size:clamp(11.5px,1.3vw,15px);font-weight:800;letter-spacing:.03em;
             color:#0b7a67;background:#0e8f7914;border:1px solid #0e8f7938;
             padding:.25em .9em;border-radius:999px;
             white-space:normal;line-height:1.45;}
  /* 人数は色を変える。みんなで＝レクの時間、ひとりで＝日々の運動 */
  .tile .tag--group{color:#9a5410;background:#f2a13a1f;border-color:#f2a13a55;}
  .tile .tag--solo{color:#4a5b73;background:#4a5b7314;border-color:#4a5b7333;}
  .tile .name{display:block;font-size:clamp(17px,2.1vw,22px);font-weight:800;line-height:1.35;}
  .tile .desc{display:block;margin-top:.35em;font-size:clamp(12px,1.4vw,15px);color:var(--text-dim);line-height:1.6;}

  /* 「はかる」は測定であることが一目で分かるよう縁の色を変える */
  .tile--measure{box-shadow:0 6px 18px #1822341a, inset 0 0 0 2px #0e8f7966;}

  /* 職員向けは利用者が押す導線と混ざらないよう、最後に小さく置く */
  .staff{margin-top:clamp(22px,4vh,40px);display:flex;justify-content:flex-end;}
  .staff-btn{display:inline-flex;align-items:center;gap:.6em;
             font-family:inherit;font-size:clamp(13px,1.5vw,16px);font-weight:700;
             color:var(--text-dim);background:#ffffff;border:1px solid var(--line);
             padding:.7em 1.4em;border-radius:999px;text-decoration:none;cursor:default;}
  .staff-btn .badge{font-size:.85em;font-weight:700;color:#ffffff;background:var(--text-dim);
                    padding:.1em .7em;border-radius:999px;}

  footer{margin-top:clamp(14px,2vh,20px);color:var(--text-dim);
         font-size:clamp(11px,1.3vw,14px);line-height:1.8;text-align:right;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="brand">KINETONE</span><span class="kana">：キネトーン</span>　高齢者向け体感ゲーム</h1>
  </header>

  <!--
    ブラウザが古すぎる端末への警告。

    施設のタブレットには Chrome 81（2020年）のような古いものがある。
    ゲームの JS には論理代入（a ||= b, Chrome 85 以降）が含まれるため、
    古い Chrome は**読み込んだ瞬間に構文エラー**になり、画面が出ないまま止まる。
    職員には「壊れている」のか「操作を間違えた」のか区別がつかない。

    UA では判定しない（機種ごとに嘘が多い）。実際に構文を解釈させて確かめる。
    この script は type="module" にしないこと。古いブラウザにも読ませる必要がある。
  -->
  <div id="too-old" hidden>
    <strong>このタブレットでは、ゲームが動きません。</strong>
    <p>ブラウザ（Chrome）が古いためです。Play ストアで Chrome を更新すると使えるようになります。</p>
    <!-- 版の数字は script が入れる。連絡をもらうときの手がかりにするだけなので、
         空のままでも文章として成り立つようにしておく。 -->
    <p class="detail"></p>
  </div>
  <script>
    (function () {
      var ok = true
      try {
        // 論理代入（Chrome 85 以降）。ゲームのビルドに含まれている。
        new Function('var a = null; a ||= 1; return a')
      } catch (e) {
        // 構文エラーのときだけ古いと判断する。CSP で new Function が
        // 止められた場合（EvalError）に誤って警告を出さないため。
        ok = !(e && e.name === 'SyntaxError')
      }
      if (!ok) {
        var el = document.getElementById('too-old')
        el.hidden = false
        var v = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1]
        if (v) {
          el.querySelector('.detail').textContent = 'いまの版: Chrome ' + v + '（必要: 85 以上）'
        }
      }
    })()
  </script>

  <main>
    <!--
      カードは kinetone.json から生成する（scripts/build-site.mjs）。
      名前・説明・タグ・サムネイル・並び順を直したいときは kinetone.json のほうを直す。
      このファイルを直接ブラウザで開くとカードは出ない。site/index.html を見ること。
    -->
    <!--{{cards}}-->
  </main>

  <div class="staff">
    <span class="staff-btn">職員メニュー<span class="badge">準備中</span></span>
  </div>

  <footer>
    <p>記録はこの端末のブラウザにのみ保存されます。カメラの映像は保存も送信もしません。</p>
  </footer>
</div>

<!--
  カメラの選択（右下の小さな歯車）。
  施設や展示で使うカメラは 1 台なので、ここで 1 回選べば全部のゲームに効く
  （選択は localStorage の共通キーに入り、各ゲームがそれを読む）。
  ホームには映像の使い手がいないので、閉じたらカメラを止める。
-->
<script type="module">
  import { createCameraManager, mountCameraSettings } from './shared/camera/index.js'
  mountCameraSettings(createCameraManager(), { stopOnClose: true })
</script>
</body>
</html>
